name: detect-new-series

on:
  schedule:
    # Weekly, Monday 06:00 UTC.  New Ubuntu series appear a few times a year;
    # weekly is frequent enough and keeps the archive probe cheap.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:devel
      # checkout requires GITHUB_WORKSPACE; expose that same working tree at
      # the install path so regeneration and PR creation need no copies.
      volumes:
        - ${{ github.workspace }}:/etc/apt/sources.list.d/pool
    defaults:
      run:
        working-directory: /etc/apt/sources.list.d/pool
    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -o APT::Update::Error-Mode=any -qq
          apt-get install -y -qq ca-certificates git distro-info python3

      - uses: actions/checkout@v7

      - name: Detect and promote new series
        id: detect
        run: |
          code=$(./.local/bin/detect-devel-series)
          if [ -d "$code" ]; then
            echo "devel is $code; pool directory already exists."
            exit 0
          fi
          mkdir "$code"
          ./.local/bin/rebuild
          echo "added=$code" >> "$GITHUB_OUTPUT"

      - name: Validate regenerated tree
        if: steps.detect.outputs.added != ''
        run: ./.local/bin/check --no-drift

      - name: Open pull request
        if: steps.detect.outputs.added != ''
        uses: peter-evans/create-pull-request@v7
        with:
          path: /etc/apt/sources.list.d/pool
          branch: auto/new-series
          commit-message: "Add Ubuntu series: ${{ steps.detect.outputs.added }}"
          title: "Add Ubuntu series: ${{ steps.detect.outputs.added }}"
          body: |
            Automated: a new Ubuntu series was detected with live apt archives
            by `.local/bin/detect-devel-series`. The workflow created its
            pool directory and generated the sources from definitions.

            Added: `${{ steps.detect.outputs.added }}`

            The pool was regenerated with `.local/bin/rebuild` and passes
            `.local/bin/check --no-drift`. Review the generated sources before
            merging.
          delete-branch: true
